apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: dev # Camada de desenvolvimento
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: api
        image: 10.43.0.50:5000/go-api:v1 # A imagem que você acabou de buildar!
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-api-service
  namespace: dev
spec:
  selector:
    app: go-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP